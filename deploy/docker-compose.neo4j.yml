# Optional Neo4j mirror of the knowledge graph (docs/knowledge-graph.md).
#   docker compose --env-file .env -f deploy/docker-compose.neo4j.yml up -d   (NEO4J_PASSWORD in .env)
#   uv run ctx graph push
# Browser: http://localhost:7474
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD (at least 8 characters)}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
