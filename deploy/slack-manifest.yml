display_information:
  name: Context Dashboard
  description: Mirrors Dashboard persona chats into Slack and reads human replies back.
features:
  bot_user:
    display_name: Context Dashboard
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
