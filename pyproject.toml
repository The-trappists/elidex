[project]
name = "context-layer"
version = "0.1.0"
description = "Capture human knowledge from Teams and email, bind it to network entities with validity, serve it to agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
    "streamlit>=1.38",
    "slack-bolt>=1.30.0",
    "aiohttp>=3.14.5",
    "pymongo>=4.19.0",
    "psycopg[binary]>=3.3.8",
    "elevenlabs>=2.77.0",
    "google-auth>=2.62.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]  # `ctx graph push`, see docs/knowledge-graph.md

[project.scripts]
ctx = "context_layer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "edge-tts>=7.3.1",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
