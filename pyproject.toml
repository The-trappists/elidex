[project]
name = "context-layer"
version = "0.1.0"
description = "Capture human knowledge from Teams and email, bind it to network entities with validity, serve it to agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
    "streamlit>=1.38",
]

[project.scripts]
ctx = "context_layer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
